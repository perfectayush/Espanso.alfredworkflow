name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make
      - run: gh release create "v${{ github.run_number }}" Espanso.alfredworkflow --generate-notes --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
