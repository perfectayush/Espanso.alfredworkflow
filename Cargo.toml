[package]
name = "alfred-espanso"
version = "0.1.0"
edition = "2021"
description = "Alfred Script Filter that fuzzy-searches espanso snippets"

[dependencies]
powerpack = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skim = { version = "5.9", default-features = false }

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = 3

[profile.release.build-override]
strip = false
